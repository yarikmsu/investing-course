# GitHub Pages Configuration
# Курс: Инвестирование в США

title: "Инвестирование в США"
description: "Полный курс по инвестированию на американском фондовом рынке для русскоязычных инвесторов"
url: "https://yarikmsu.github.io"
baseurl: "/investing-course"

# Theme
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Language
lang: ru

# Logo (optional)
# logo: "/assets/images/logo.png"

# Color scheme (light, dark, or custom)
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Navigation
nav_enabled: true

# Footer
footer_content: "Курс по инвестированию в США &copy; 2025-2026. Это образовательный материал, а не финансовый совет."

# Back to top link
back_to_top: true
back_to_top_text: "Наверх"

# Heading anchor links
heading_anchors: true

# External links
aux_links:
  "GitHub":
    - "//github.com/yarikmsu/investing-course"

aux_links_new_tab: true

# Collections
collections:
  modules:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "module-*"
    values:
      parent: "Модули курса"

# Exclude files
exclude:
  - CLAUDE.md
  - IMPROVEMENT_PLAN.md
  - AUDIT-REPORT.md
  - "*.sh"
  - .gitignore

# Include files
include:
  - _config.yml

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown processor
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
