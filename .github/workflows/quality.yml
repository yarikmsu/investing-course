name: Content quality gate

# Гейт качества контента (BL-401):
#   - внутренние ссылки должны соответствовать объявленным permalink
#   - наборы файлов ru/ и en/ должны совпадать (кроме RUSSIA.md)
#   - расхождение структуры заголовков RU/EN — предупреждение в логе
on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links and RU/EN parity
        run: python3 scripts/check-parity.py
