name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies (RU)
        working-directory: ./ru
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build Russian site
        working-directory: ./ru
        run: bundle exec jekyll build -d ../_site/ru
        env:
          JEKYLL_ENV: production

      - name: Install dependencies (EN)
        working-directory: ./en
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build English site
        working-directory: ./en
        run: bundle exec jekyll build -d ../_site/en
        env:
          JEKYLL_ENV: production

      - name: Copy landing page
        run: cp index.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Только main деплоится на продакшен; остальные ветки и PR — только сборка-проверка
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
