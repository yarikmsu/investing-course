# English version of the course
title: "US Investing Course"
description: "A comprehensive guide to investing in the US stock market"
url: "https://yarikmsu.github.io"
baseurl: "/investing-course/en"

# Privacy-friendly analytics (BL-601). GoatCounter — no cookies, no PII.
# Set to your GoatCounter code (the subdomain of yourcode.goatcounter.com)
# to enable; leave blank to disable. Free & privacy-first: https://www.goatcounter.com
goatcounter_code:

# Newsletter capture (BL-604). Set to your form POST endpoint to enable —
# Buttondown: https://buttondown.email/api/emails/embed-subscribe/USERNAME
# or a Formspree/Tally URL. Leave blank to disable.
newsletter_action:

# Theme
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Language
lang: en

# Color scheme
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Navigation
nav_enabled: true

nav_external_links:
  - title: "🇷🇺 Русский"
    url: "https://yarikmsu.github.io/investing-course/ru/"

# Footer
footer_content: "US Investing Course &copy; 2025-2026. This is educational material, not financial advice."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchor links
heading_anchors: true

# External links
aux_links:
  "GitHub":
    - "//github.com/yarikmsu/investing-course"

aux_links_new_tab: true

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.sh"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown processor
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true
  syntax_highlighter: rouge
