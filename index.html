<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>US Investing Course | Инвестирование в США</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Comprehensive investing course for US markets. Available in English and Russian.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .description {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            max-width: 400px;
        }
        .languages {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 2.5rem;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .lang-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .flag { font-size: 2rem; }
        .lang-name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .lang-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer {
            margin-top: 3rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }
        .footer a {
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 US Investing Course</h1>
        <p class="subtitle">Choose your language / Выберите язык</p>
        <p class="description">A comprehensive guide to investing in the US stock market based on passive investing principles.</p>
        <div class="languages">
            <a href="./ru/" class="lang-btn">
                <span class="flag">🇷🇺</span>
                <span class="lang-name">
                    <span class="lang-label">Russian</span>
                    <span>Русский</span>
                </span>
            </a>
            <a href="./en/" class="lang-btn">
                <span class="flag">🇺🇸</span>
                <span class="lang-name">
                    <span class="lang-label">English</span>
                    <span>English</span>
                </span>
            </a>
        </div>
        <p class="footer">
            Educational material, not financial advice.<br>
            <a href="https://github.com/yarikmsu/investing-course">GitHub</a>
        </p>
    </div>
</body>
</html>
